# === 候选仓库池 ===
#
# 课题硬性要求：GitHub Star > 100（Python 为主，Go/Rust/TS 亦可）
#
# 在此之上，出题成功率取决于以下工程性标准（实测经验，详见 PROGRESS.md）：
#   1. 有完整自带测试套件      —— 没测试就无法自动判分
#   2. 依赖轻、可离线安装      —— 装不上依赖 → 镜像构建失败 → 整题作废
#   3. 基线测试全绿            —— 基线本身红，无法区分"挖空导致的红"与"本来就红"
#   4. 测试跑得快（全量<5min） —— 每题要跑 4 轮，慢仓库成本爆炸
#   5. 无需外部服务/GPU/DB     —— 沙箱内无法提供
#
# ⚠️ 实测坑：测试依赖常藏在 conftest.py 里（如 cachecontrol 需 cherrypy），
#    仅装 pyproject 的 dependencies 会导致收集失败。故显式声明 test_extras。

defaults:
  python_version: "3.11"
  test_framework: pytest
  # 每个仓库都先跑基线，不绿则淘汰
  baseline_required: true

repos:
  # ---------- 已实测通过（M1 打样标本）----------
  - name: psf/cachecontrol
    language: python
    stars: 500
    clone_url: https://github.com/psf/cachecontrol.git
    # ⚠️ 依赖声明必须完整到「基线全绿」为止（实测教训）：
    #    · conftest.py 直接 import cherrypy（测试服务器）
    #    · tests/test_cache_control.py 与 test_storage_filecache.py 需要 filelock
    #      （属 cachecontrol[filecache] extras，不在主 dependencies 里）
    #    只装 pyproject 的 dependencies 会导致基线 1 失败 + 1 收集错误，整仓库被淘汰
    install:
      - "pip install -e ."
      - "pip install cherrypy filelock redis"
    test_extras: ["cherrypy", "filelock", "redis"]
    test_cmd: "pytest tests/ -q"
    fast_targets: ["tests/test_serialization.py", "tests/test_cache_control.py"]
    verified: true                      # 已跑通端到端，通过率 4/6
    notes: "仅依赖 requests+msgpack，测试快(<5s)，是理想标本"

  # ---------- 候选池（按依赖轻重排序，待基线验证）----------
  - name: jd/tenacity
    language: python
    stars: 6000
    clone_url: https://github.com/jd/tenacity.git
    # ⚠️ 测试依赖声明必须完整（实测教训）：tests/test_tornado.py 直接 import tornado，
    #    缺失会导致 pytest 收集阶段 Interrupted，整仓库被淘汰
    install: ["pip install -e .", "pip install pytest tornado"]
    test_extras: ["tornado"]
    test_cmd: "pytest tests/ -q"
    notes: "重试库，纯逻辑无外部依赖，分支多适合出题"

  - name: python-humanize/humanize
    language: python
    stars: 1900
    clone_url: https://github.com/python-humanize/humanize.git
    # ⚠️ tests/test_benchmarks.py 依赖 pytest-benchmark 的 benchmark fixture，
    #    缺失会导致 15 个用例 error，基线不绿
    install: ["pip install -e .", "pip install pytest freezegun pytest-benchmark"]
    test_extras: ["freezegun", "pytest-benchmark"]
    test_cmd: "pytest tests/ -q"
    notes: "文本格式化，纯函数多，判据清晰"

  # ⚠️ 已移除 ets-labs/python-dependency-injector：
  #    10 个扩展测试（aiohttp/flask/fastapi/pydantic）收集报错导致 Interrupted，
  #    且含 Cython 扩展、可选依赖极重，出题性价比低（详见 PROGRESS.md 已知坑 #28）。

  - name: pallets/itsdangerous
    language: python
    stars: 2900
    clone_url: https://github.com/pallets/itsdangerous.git
    install: ["pip install -e .", "pip install pytest freezegun"]
    test_extras: ["freezegun"]
    test_cmd: "pytest tests/ -q"
    notes: "签名/序列化，纯逻辑、零外部依赖"

  - name: theskumar/python-dotenv
    language: python
    stars: 7800
    clone_url: https://github.com/theskumar/python-dotenv.git
    # ⚠️ 必须装 [cli] extra（否则 dotenv 命令行入口不存在，CLI 相关测试全红，
    #    曾误判为 BASELINE 不绿，实测排查确认见 PROGRESS.md）
    install: ["pip install -e .[cli]", "pip install pytest sh"]
    # ⚠️ test_run_with_command_flags 调用系统 `printenv --version`：
    #    macOS 自带 BSD printenv 不支持该参数（本地预筛环境用），
    #    而 Dockerfile/沙箱用 Linux 基础镜像的 GNU printenv 原生支持——
    #    纯属本地预筛（macOS）与目标沙箱（Linux）的平台差异，与仓库/
    #    依赖健康度无关，在真实沙箱里该用例本就会通过。跳过它以避免
    #    本地基线被这一条平台噪音误判为不绿（实测排查确认见 PROGRESS.md）。
    test_cmd: "pytest tests/ -q --deselect tests/test_cli.py::test_run_with_command_flags"
    test_extras: []
    notes: "解析逻辑清晰，边界情况多"

  - name: john-kurkowski/tldextract
    language: python
    stars: 2000
    clone_url: https://github.com/john-kurkowski/tldextract.git
    install: ["pip install -e .", "pip install pytest responses sybil pytest-mock syrupy"]
    test_extras: ["responses", "sybil", "pytest-mock", "syrupy"]
    test_cmd: "pytest tests/ -q"
    notes: "域名解析，注意部分测试需要网络，需 --network none 筛查"

  - name: Delgan/loguru
    language: python
    stars: 19000
    clone_url: https://github.com/Delgan/loguru.git
    install: ["pip install -e .", "pip install pytest freezegun colorama"]
    test_extras: ["freezegun", "colorama"]
    test_cmd: "pytest tests/ -q"
    notes: "测试量大，用 fast_targets 限定范围"

  - name: hukkin/tomli
    language: python
    stars: 800
    clone_url: https://github.com/hukkin/tomli.git
    install: ["pip install -e .", "pip install pytest"]
    test_cmd: "pytest tests/ -q"
    notes: "TOML 解析器，纯逻辑、极轻，适合 easy/medium 题"

  # ---------- 多语言覆盖（课题允许 Go/Rust/TS）----------
  # 说明：多语言会显著增加 Dockerfile 与 verify.sh 的适配成本，
  #      策略是先用 Python 凑够 ≥10 题，再补 1 道多语言题证明通路。
  - name: spf13/cast
    language: go
    stars: 3600
    clone_url: https://github.com/spf13/cast.git
    install: ["go mod download"]
    test_cmd: "go test ./... -v"
    priority: low
    notes: "Go 类型转换库，无外部依赖，用于验证多语言通路"
